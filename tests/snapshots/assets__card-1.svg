<svg xmlns="http://www.w3.org/2000/svg" width="290" height="150" viewBox="0 0 290 150" role="img" aria-labelledby="t">
<title id="t">FoodLister</title>
<style>
:root{--bg:#0d1117;--fg:#c9d1d9;--mut:#8b949e;--bd:#30363d;--ac:#3fb950;--bl:#58a6ff;--pn:#161b22}
@media(prefers-color-scheme:light){:root{--bg:#fff;--fg:#24292f;--mut:#57606a;--bd:#d0d7de;--ac:#1a7f37;--bl:#0969da;--pn:#f6f8fa}}
text{font-family:ui-monospace,Consolas,monospace;font-size:14px;fill:var(--fg)}
.mut{fill:var(--mut)}.ac{fill:var(--ac)}.bl{fill:var(--bl)}.sm{font-size:12px}.big{font-size:22px;fill:var(--ac)}.h1{font-size:20px;fill:var(--ac)}
.win{fill:var(--bg);stroke:var(--bd)}.bar{fill:var(--pn)}.line{stroke:var(--bd)}.pill{fill:var(--pn);stroke:var(--bd)}.card{fill:none;stroke:var(--bd)}
.card{transition:.2s}.card:hover{stroke:var(--ac);stroke-width:2}.cell:hover{stroke:var(--fg);stroke-width:1}.lg{font-size:14px}.acf{fill:var(--ac)}.spark{fill:none;stroke:var(--ac);stroke-width:1.5}.dash{stroke:var(--bd);stroke-dasharray:3 3}
</style>
<rect class="card" x="1" y="1" width="288" height="148" rx="6"/>
<text x="14" y="32" font-weight="bold" font-size="16">FoodLister</text>
<text class="mut" x="14" y="56">Receitas.</text>
<polyline class="spark" points="14.0,116.0 37.8,112.0 61.6,108.0 85.5,104.0 109.3,100.0 133.1,96.0 156.9,92.0 180.7,96.0 204.5,100.0 228.4,104.0 252.2,108.0 276.0,112.0" pathLength="200" stroke-dasharray="200"><animate attributeName="stroke-dashoffset" values="200;200;0" keyTimes="0.0000;0.0000;1.0000" dur="1.60s" begin="0s" fill="freeze"/></polyline>
<text class="mut sm" x="14" y="136">TypeScript · ★ 3</text>
</svg>
